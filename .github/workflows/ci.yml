name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check scripts src tests
      - name: Unit tests
        run: uv run pytest

  # The golden fingerprints were computed on macOS (arm64, Apple Accelerate); the synthetic data has many
  # values tied up to roundoff, so other BLAS libraries can rank them differently.
  synthetic:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOC_N_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen --all-extras
      - name: Synthetic pipeline (scripts/reproduce.py --smoke) against the golden fingerprints
        run: uv run pytest -m slow --basetemp="$RUNNER_TEMP/pytest"
      - name: Keep the smoke run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-logs
          path: ${{ runner.temp }}/pytest/**/runs/golden/logs/
          if-no-files-found: ignore
