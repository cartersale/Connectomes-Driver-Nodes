[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "higher-order-connectomes"
version = "0.1.0"
description = "Analysis code for: Hub Inputs Funnel Control into the Connectome's Dominant Mode."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bctpy>=0.6.1,<0.7",
  "gudhi==3.13.0",
  "joblib>=1.4",
  "threadpoolctl>=3",
  "matplotlib",
  "networkx>=3.4",
  "nibabel",
  "netneurotools==0.3.0",
  "neuromaps==0.0.7",
  "nilearn>=0.13",
  "numpy>=2.1,<2.2",
  "pandas>=2.2,<2.3",
  "ripser==0.6.14",
  "scipy>=1.15,<1.16",
  "statsmodels",
  "tabulate==0.10.0",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
python-preference = "only-managed"
# Pin the lock to the versions that produced the paper's results. Change these only together with a
# full run validated against reference/ (scripts/paper/validate.py).
constraint-dependencies = [
  "bctpy==0.6.1",
  "gudhi==3.13.0",
  "joblib==1.4.2",
  "matplotlib==3.10.0",
  "netneurotools==0.3.0",
  "networkx==3.4.2",
  "netneurotools==0.3.0",
  "neuromaps==0.0.7",
  "nibabel==5.4.2",
  "nilearn==0.13.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "persim==0.3.8",
  "ripser==0.6.14",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "statsmodels==0.14.4",
  "tqdm==4.67.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not data and not slow'"
markers = [
  "slow: runs the synthetic pipeline end to end (minutes; run with -m slow)",
  "data: needs the real connectome data and a finished run directory",
]
filterwarnings = ["ignore::DeprecationWarning:nilearn.*", "ignore::DeprecationWarning:bct.*",
  # numpy + Apple Accelerate sets spurious FP flags in matmul (results are checked)
  "ignore:.*encountered in matmul:RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Conservative: real errors only (pyflakes, syntax), plus import order.
select = ["E9", "F", "I"]
ignore = ["E402"]
