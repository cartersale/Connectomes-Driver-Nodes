title = "Higher-order connectome control analysis"

[paths]
raw_connectomes = "data/raw/Individual_Connectomes.mat"
atlas_dir = "data/external/atlas_cache/atl-cammoun2012/fsaverage5"

[analysis]
parcellation_scales = [68, 114, 219]
random_seed = 20260423
top_k_values = [1, 2, 3, 5]
larger_k_fractions = [0.05, 0.10, 0.20]
save_landscape_samples = true

[control]
primary_c = 0.1
sensitivity_c_values = [0.01, 1.0]
primary_epsilon = 1.0e-5
sensitivity_epsilon_values = [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
finite_horizons = [1.0, 2.5, 5.0]
bottom_eigenspace_dim = 5

[rankings]
primary_methods = ["degree_strength", "betweenness", "cycle_participation"]
secondary_methods = [
  "eigenvector_centrality",
  "participation_coefficient",
  "degree_normalized_cycle_participation",
  "cycle_criticality",
  "triangle_participation",
  "tetrahedron_participation",
]
n_random_rankings = 100

[landscape]
max_enumerated_sets = 5000
near_optimal_thresholds = [0.01, 0.05, 0.10]
greedy_candidate_pool = 25

[targets]
surface_map_top_n = 15
sparse_frontocingulate_count = 6

[weighted_inputs]
support_sizes = [1, 2, 5, 10]

[robustness]
n_perturbations = 50
noise_sigmas = [0.05, 0.10, 0.20]
dropout_probabilities = [0.05, 0.10, 0.20]

[hub_lesion]
hub_counts = [5, 10, 15]
methods = ["degree_strength", "cycle_participation"]

[anatomy]
# Exact Desikan-Killiany base-region names (no substring matching, which would
# let "cuneus" also match "precuneus").
association_regions = [
  "superiorfrontal", "rostralmiddlefrontal", "caudalmiddlefrontal",
  "lateralorbitofrontal", "medialorbitofrontal", "frontalpole",
  "superiorparietal", "inferiorparietal", "precuneus",
  "rostralanteriorcingulate", "caudalanteriorcingulate", "posteriorcingulate",
  "isthmuscingulate", "insula",
]
occipital_regions = ["cuneus", "lateraloccipital", "lingual", "pericalcarine"]

[seeds]
# Seeds of stages that draw their own random samples (all other draws derive from analysis.random_seed).
canonical_graphs = 20261001  # model networks (mechanisms/02_canonical_graphs)
core_cut = 20261026          # matched control edges (mechanisms/07_core_cut)

[sampling]
# Ensemble sizes of the null, resampling and permutation analyses.
n_nulls = 50              # null networks per subject and null model (null_models/01_run_nulls)
n_model_graphs = 50       # model networks per family and weighting (mechanisms/02_canonical_graphs)
core_cut_draws = 20       # matched control cuts per subject (mechanisms/07_core_cut)
n_random_lesions = 100     # random lesions per subject (lesions/01_run_reciprocal_lesion)
n_spins = 10000          # spin-test rotations (target_states/05_spin_tests)
